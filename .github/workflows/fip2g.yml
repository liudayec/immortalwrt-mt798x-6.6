name: fip-2gb
on:
  push:
    paths:
      - '.github/workflows/fip2g.yml'
  workflow_dispatch:

jobs:
  b:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu device-tree-compiler bc bison flex python3 python3-setuptools swig libssl-dev uuid-dev
          aarch64-linux-gnu-gcc --version | head -1

      - name: clone-bl-mt798x
        run: |
          git clone --depth 1 https://github.com/hanwckf/bl-mt798x.git bl
          cd bl && git log --oneline -1

      - name: patch-init.c-dram_init
        run: |
          F=bl/uboot-mtk-20250711/arch/arm/mach-mediatek/mt7986/init.c
          echo "=== 原始 dram_init ==="
          sed -n '15,28p' "$F"
          python3 -c "import re,sys; p='$F'; s=open(p).read(); new=chr(10).join(['int dram_init(void)','{','\tgd->ram_base = 0x40000000UL;','\tgd->ram_size = SZ_2G;','\treturn 0;','}']); s2,n=re.subn(r'int dram_init\(void\)\s*\{.*?\n\}', new, s, count=1, flags=re.S); sys.exit('replace failed n=%d'%n) if n!=1 else open(p,'w').write(s2); print('patched OK')"
          echo "=== 修改后 ==="
          sed -n '15,28p' "$F"

      - name: build-uboot
        run: |
          set -e
          U=bl/uboot-mtk-20250711
          export CROSS_COMPILE=aarch64-linux-gnu-
          CFG=mt7986a_emmc_rfb_defconfig
          echo "使用配置: $CFG"
          cp "$U/configs/$CFG" "$U/.config"
          make -C "$U" olddefconfig
          make -C "$U" clean
          make -C "$U" -j$(nproc) all
          ls -la "$U/u-boot.bin" "$U/u-boot.dtb" 2>/dev/null || true

      - name: verify-dram-init-in-binary
        run: |
          U=bl/uboot-mtk-20250711
          echo "=== 确认 dram_init 里写入了 0x80000000 (SZ_2G) ==="
          aarch64-linux-gnu-objdump -d "$U/u-boot" 2>/dev/null | \
            grep -A6 "<dram_init>:" | head -12 || echo "(objdump 失败)"

      - name: build-atf-fip
        run: |
          set -e
          A=bl/atf-20250711
          export CROSS_COMPILE=aarch64-linux-gnu-
          if [ -e "$A/makefile" ]; then MK=makefile; else MK=Makefile; fi
          make -C "$A" -f "$MK" clean CONFIG_CROSS_COMPILER=aarch64-linux-gnu- CROSS_COMPILER=aarch64-linux-gnu- || true
          rm -rf "$A/build"
          make -C "$A" -f "$MK" mt7986_jdcloud_re-cp-03_defconfig \
            CONFIG_CROSS_COMPILER=aarch64-linux-gnu- CROSS_COMPILER=aarch64-linux-gnu-
          make -C "$A" -f "$MK" all \
            CONFIG_CROSS_COMPILER=aarch64-linux-gnu- CROSS_COMPILER=aarch64-linux-gnu- \
            CONFIG_BL33="$PWD/bl/uboot-mtk-20250711/u-boot.bin" \
            BL33="$PWD/bl/uboot-mtk-20250711/u-boot.bin" -j$(nproc)
          ls -la "$A/build/mt7986/release/" || true

      - name: collect
        run: |
          mkdir -p out
          cp bl/atf-20250711/build/mt7986/release/fip.bin out/fip_2g.bin 2>/dev/null || true
          cp bl/uboot-mtk-20250711/u-boot.bin out/u-boot_2g.bin 2>/dev/null || true
          ls -la out/
          for f in out/*; do echo "$f = $(stat -c%s $f) md5=$(md5sum $f|cut -d' ' -f1)"; done

      - uses: actions/upload-artifact@v4
        with:
          name: fip2g
          path: out/*
          retention-days: 30

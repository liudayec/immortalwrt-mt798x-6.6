name: q6000
on:
  push:
    paths:
      - '.github/workflows/q6000.yml'
  workflow_dispatch:

jobs:
  b:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: clone-dailook-source
        working-directory: .
        run: |
          git clone --depth 1 -b openwrt-24.10 https://github.com/dailook/immortalwrt-24.10.git src
          ls src | head
          grep -c "ikuai_q6000-emmc" src/target/linux/mediatek/image/filogic.mk || true

      - name: deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget subversion

      - name: feeds-thirdparty
        run: |
          echo 'src-git openclash https://github.com/vernesong/OpenClash.git;master' >> feeds.conf.default
          echo 'src-git lucky https://github.com/gdy666/luci-app-lucky.git;main' >> feeds.conf.default

      - name: dts-downclock
        run: |
          D=target/linux/mediatek/dts/mt7986a-ikuai-q6000-emmc.dts
          sed -i 's/max-frequency = <200000000>/max-frequency = <52000000>/' $D
          sed -i '/mmc-hs200-1_8v/d' $D
          sed -i '/mmc-hs400-1_8v/d' $D
          sed -i '/hs400-ds-delay/d' $D
          echo '--- 改后 ---'
          grep -E 'max-frequency|mmc-hs|bus-width|cap-mmc' $D

      - name: feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: config
        run: |
          cat >> .config <<'CFGEOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_ikuai_q6000-emmc=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-app-quickstart=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-ksmbd=y
          CONFIG_PACKAGE_ksmbd-server=y
          CONFIG_PACKAGE_luci-app-netspeedtest=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-wrtbwmon=y
          CONFIG_PACKAGE_luci-app-eqos=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-nf-flow=y
          CONFIG_KERNEL_BPF_SYSCALL=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_VETH=y
          CONFIG_KERNEL_OVERLAY_FS=y
          CONFIG_KERNEL_TUN=y
          CFGEOF
          make defconfig
          echo '--- check ---'
          grep -E 'DEVICE_ikuai|PACKAGE_(docker|luci-app-store|luci-app-openclash|luci-app-lucky|luci-app-quickstart)|ROOTFS_PARTSIZE' .config || true

      - name: download
        run: make download -j8 || make download -j1

      - name: build
        run: make -j$(nproc) || make -j1 V=s

      - name: collect
        run: |
          mkdir -p ../out
          cp bin/targets/mediatek/filogic/*ikuai* ../out/ 2>/dev/null || true
          cp bin/targets/mediatek/filogic/profiles.json ../out/ 2>/dev/null || true
          ls -la ../out/

      - uses: actions/upload-artifact@v4
        with:
          name: fw
          path: out/*
          retention-days: 30

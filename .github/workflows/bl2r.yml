name: bl2-rank1
on:
  push:
    paths:
      - '.github/workflows/bl2r.yml'
  workflow_dispatch:

jobs:
  b:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu device-tree-compiler bc bison flex python3
          aarch64-linux-gnu-gcc --version | head -1

      - name: clone-atf
        run: |
          git clone --depth 1 -b mtksoc https://github.com/mtk-openwrt/arm-trusted-firmware.git atf
          cd atf && git log --oneline -1

      - name: patch-dram-rank
        run: |
          python3 - <<'PYEOF'
          import sys
          p = "atf/plat/mediatek/mt7986/drivers/dram/release/dram.a"
          d = bytearray(open(p,"rb").read())
          OFF = 0x00078e
          orig = bytes.fromhex("e0079f1a")   # cset w0, ne
          new  = bytes.fromhex("00008052")   # mov  w0, #0
          if d[OFF:OFF+4] != orig:
              print("WARN: bytes at 0x78e = %s (expect e0079f1a), searching..." % d[OFF:OFF+4].hex())
              i = d.find(orig)
              found = []
              while i >= 0:
                  found.append(i); i = d.find(orig, i+1)
              print("found %d occurrences: %s" % (len(found), [hex(x) for x in found]))
              # 用第一个（get_dram_rank_nr 是文件最前面的那个）
              if not found:
                  sys.exit("no cset found")
              OFF = found[0]
              print("patching at 0x%x" % OFF)
          d[OFF:OFF+4] = new
          open(p,"wb").write(d)
          print("patched at 0x%x: e0079f1a -> 00008052" % OFF)
          print("new bytes: %s" % d[OFF:OFF+4].hex())
          PYEOF

      - name: build
        run: |
          cd atf
          make -j$(nproc) \
            CROSS_COMPILE=aarch64-linux-gnu- \
            PLAT=mt7986 \
            BOOT_DEVICE=emmc \
            DRAM_USE_DDR4=1 \
            DDR4_FREQ_2666=1 \
            DRAM_DEBUG_LOG=1 \
            all
          ls -la build/mt7986/release/ || true

      - name: collect
        run: |
          mkdir -p out
          cp atf/build/mt7986/release/bl2.img out/bl2_rank1.img 2>/dev/null || true
          cp atf/build/mt7986/release/bl2.bin out/bl2_rank1.raw 2>/dev/null || true
          ls -la out/
          for f in out/*; do echo "$f = $(stat -c%s $f) md5=$(md5sum $f|cut -d' ' -f1)"; done

      - uses: actions/upload-artifact@v4
        with:
          name: bl2r
          path: out/*
          retention-days: 30
